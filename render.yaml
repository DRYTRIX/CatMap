# Render Blueprint for CatMap.
# Deploy: push to GitHub, then Render Dashboard → New → Blueprint → select repo.
databases:
  - name: catmap-db
    databaseName: catmap
    user: catmap
    plan: basic-256mb

services:
  - type: web
    name: catmap-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: catmap-db
          property: connectionString
      # Render's connection string starts with postgresql://; SQLAlchemy needs
      # the psycopg driver. Override here with the +psycopg form if needed, or
      # the app normalizes it (see app/database.py note in README).
      # Still required for direct API access; the frontend proxies /api same-origin.
      - key: CORS_ORIGINS
        value: https://catmap.drytrix.com,https://catmap-frontend.onrender.com,https://localhost
      - key: PUBLIC_SITE_URL
        value: https://catmap.drytrix.com
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: CAT_DETECTION_ENABLED
        value: "true"
      - key: CAT_DETECTION_THRESHOLD
        value: "0.20"
      - key: CAT_DETECTION_ANIMAL_THRESHOLD
        value: "0.30"
      - key: CAT_DETECTION_STRICT
        value: "true"
      # Optional: set a Sentry DSN in the Render dashboard to enable error
      # tracking. Empty = disabled.
      - key: SENTRY_DSN
        sync: false
      # Set a secret value in the Render dashboard to enable the /admin
      # moderation UI + /api/admin endpoints. Empty/unset = admin disabled.
      - key: ADMIN_TOKEN
        sync: false
      # Optional: total database storage (MB) for the admin dashboard capacity
      # bar. Match the database plan's disk size. Unset/0 = bar hidden.
      - key: DB_CAPACITY_MB
        value: "1024"
      # Optional: Telegram bot token + chat id for new-sighting / approval alerts.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Web Push (VAPID) — generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@catmap.local
      # FCM HTTP v1 — paste Firebase service-account JSON (single line)
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: catmap-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      # Empty = browser calls /api on the frontend origin (nginx proxies to backend).
      - key: VITE_API_BASE
        value: ""
      - key: BACKEND_URL
        value: https://catmap-backend.onrender.com
      - key: BACKEND_HOST
        value: catmap-backend.onrender.com
      # Set your real G-XXXXXXXXXX in the Render dashboard, then redeploy.
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      # Optional: set a Sentry DSN in the Render dashboard, then redeploy.
      - key: VITE_SENTRY_DSN
        sync: false