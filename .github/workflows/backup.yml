name: Database backup

# Nightly Postgres dump, uploaded as a workflow artifact (and optionally to
# S3-compatible storage). Skipped unless the BACKUP_DATABASE_URL secret is
# set — see docs/operations.md for setup instructions.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        id: dump
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::BACKUP_DATABASE_URL secret not set — skipping backup."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./backend/scripts/backup_db.sh ./backups
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact
        if: steps.dump.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: catmap-db-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30

      # Optional: also copy to an S3-compatible bucket for longer retention.
      # Requires BACKUP_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      # (and AWS_DEFAULT_REGION / AWS_ENDPOINT_URL for non-AWS providers).
      - name: Upload to S3 (optional)
        if: steps.dump.outputs.ran == 'true' && secrets.BACKUP_S3_BUCKET != ''
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: aws s3 cp ./backups/ "s3://${BACKUP_S3_BUCKET}/catmap/" --recursive
