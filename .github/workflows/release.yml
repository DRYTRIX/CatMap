name: Release

on:
  push:
    tags: ["v*"]

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      version_code: ${{ steps.parse.outputs.version_code }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Validate semver tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match vMAJOR.MINOR.PATCH (e.g. v1.2.3), got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Validated $TAG -> versionName=$VERSION, versionCode=$VERSION_CODE"

  deploy-render:
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Deploy backend to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::error::Missing secret RENDER_DEPLOY_HOOK_BACKEND"
            exit 1
          fi
          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            URL="${DEPLOY_HOOK}&ref=${TAG}"
          else
            URL="${DEPLOY_HOOK}?ref=${TAG}"
          fi
          curl -fsS -X POST "$URL"
          echo "Triggered backend deploy for $TAG"

      - name: Deploy frontend to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::error::Missing secret RENDER_DEPLOY_HOOK_FRONTEND"
            exit 1
          fi
          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            URL="${DEPLOY_HOOK}&ref=${TAG}"
          else
            URL="${DEPLOY_HOOK}?ref=${TAG}"
          fi
          curl -fsS -X POST "$URL"
          echo "Triggered frontend deploy for $TAG"

  android-release:
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile bundle and sync Capacitor
        working-directory: frontend
        run: bash scripts/build-mobile.sh

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > frontend/android/catmap-upload.keystore
          cat > frontend/android/keystore.properties <<EOF
          storeFile=../catmap-upload.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release APK and AAB
        working-directory: frontend/android
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          VERSION_CODE: ${{ needs.validate-tag.outputs.version_code }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease bundleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE"

      - name: Rename release artifacts
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          mkdir -p release-artifacts
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "release-artifacts/catmap-${TAG}.apk"
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab "release-artifacts/catmap-${TAG}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ needs.validate-tag.outputs.tag }}
          path: release-artifacts/
          retention-days: 90

  github-release:
    runs-on: ubuntu-latest
    needs: [validate-tag, deploy-render, android-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          name: android-release-${{ needs.validate-tag.outputs.tag }}
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: CatMap ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/catmap-${{ needs.validate-tag.outputs.tag }}.apk
            release-artifacts/catmap-${{ needs.validate-tag.outputs.tag }}.aab
